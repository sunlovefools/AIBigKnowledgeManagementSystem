services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cgi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; try: urllib.request.urlopen('http://localhost:8000/hello', timeout=5); sys.exit(0) except: sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - backend-logs:/app/logs

networks:
  app-network:
    driver: bridge

volumes:
  backend-logs: